name: Deploy PulsoAtom

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operación explícita: deploy, comprobación, inspección, preparación, renovación, ampliación o estado'
        type: choice
        options: [deploy, web-static-install, tuesday-wednesday-prioritize-thursday, tuesday-wednesday-probe, tuesday-wednesday-inspect, tuesday-wednesday-start, tuesday-wednesday-start-two, tuesday-wednesday-stop, tuesday-wednesday-status, thursday-handoff-inspect, thursday-handoff-prepare, gemma-rejection-inspect, gemma-format-preflight, gemma-tuesday-continue, gemma-tuesday-recover, gemma-tuesday-status, gemma-identity-inspect, navigation-benchmark, daily-activity-inspect, daily-activity-enable, daily-activity-run-yesterday, evaluation-batch-inspect, local-next500-inspect, local-next500-start, local-next500-status, gemma-preflight, gemma-inspect, gemma-prepare, gemma-start, gemma-extend, gemma-status]
        default: deploy
        required: true
      first_run_date:
        description: 'Primer día de la programación diaria HN/PA, YYYY-MM-DD (daily-activity-enable)'
        type: string
        required: false
      activity_date:
        description: 'Día de actividad a evaluar: debe ser ayer en Honduras (daily-activity-run-yesterday)'
        type: string
        required: false
      expected_settings_version:
        description: 'Versión de configuración comprobada con daily-activity-inspect o thursday-handoff-inspect'
        type: string
        required: false
      resume_tuesday:
        description: 'Retomar martes automáticamente antes del mediodía o dejarlo en espera'
        type: choice
        options: ['automatic_before_noon', 'manual']
        default: 'automatic_before_noon'
        required: false
      expected_scope_hash:
        description: 'Huella de alcance comprobada con thursday-handoff-inspect (64 hex) '
        type: string
        required: false
      handoff_concurrency:
        description: 'Concurrencia del jueves; 2 requiere el piloto aprobado (thursday-handoff-prepare)'
        type: choice
        options: ['1', '2']
        default: '1'
        required: false
      job_id:
        description: 'UUID de un lote dual existente para auditarlo sin ejecutar IA (evaluation-batch-inspect)'
        type: string
        required: false
      expected_policy_version:
        description: 'Versión esperada de política (obligatoria para gemma-prepare y gemma-start)'
        type: string
        required: false
      expected_evaluations:
        description: 'Evaluaciones existentes antes del respaldo (gemma-start); total actual esperado del mantenimiento, 1 a 500 (gemma-extend)'
        type: string
        required: false
      expected_configuration_hash:
        description: 'Huella de configuración Gemma validada en preflight (gemma-start, 64 hex)'
        type: string
        required: false
      expected_catalog_hash:
        description: 'Huella de catálogo validada en preflight (gemma-start, 64 hex)'
        type: string
        required: false
      expected_prompt_hash:
        description: 'Huella de instrucciones validada en preflight (gemma-start, 64 hex)'
        type: string
        required: false
      maintenance_id:
        description: 'UUID del mantenimiento para consultar su avance o ampliarlo (gemma-status/gemma-extend)'
        type: string
        required: false
      from_date:
        description: 'Inicio inclusivo por última actividad en Tegucigalpa (gemma-start/gemma-extend, YYYY-MM-DD)'
        type: string
        required: false
      to_date:
        description: 'Fin inclusivo por última actividad en Tegucigalpa (gemma-start/gemma-extend, YYYY-MM-DD)'
        type: string
        required: false
      conversation_limit:
        description: 'Total objetivo de conversaciones más recientes del período (gemma-start: 1 a 100; gemma-extend: 1 a 500, conservando las existentes)'
        type: string
        default: '20'
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-pulso-atom-production
  cancel-in-progress: false

jobs:
  gemma-check:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'web-static-install' || inputs.operation == 'tuesday-wednesday-probe' || inputs.operation == 'tuesday-wednesday-inspect' || inputs.operation == 'tuesday-wednesday-prioritize-thursday' || inputs.operation == 'tuesday-wednesday-start' || inputs.operation == 'tuesday-wednesday-start-two' || inputs.operation == 'thursday-handoff-prepare' || inputs.operation == 'tuesday-wednesday-stop' || inputs.operation == 'tuesday-wednesday-status' || inputs.operation == 'thursday-handoff-inspect' || inputs.operation == 'gemma-rejection-inspect' || inputs.operation == 'gemma-format-preflight' || inputs.operation == 'gemma-tuesday-continue' || inputs.operation == 'gemma-tuesday-recover' || inputs.operation == 'gemma-tuesday-status' || inputs.operation == 'gemma-identity-inspect' || inputs.operation == 'navigation-benchmark' || inputs.operation == 'daily-activity-enable' || inputs.operation == 'daily-activity-run-yesterday' || inputs.operation == 'daily-activity-inspect' || inputs.operation == 'evaluation-batch-inspect' || inputs.operation == 'local-next500-inspect' || inputs.operation == 'local-next500-start' || inputs.operation == 'local-next500-status' || inputs.operation == 'gemma-preflight' || inputs.operation == 'gemma-inspect' || inputs.operation == 'gemma-prepare' || inputs.operation == 'gemma-start' || inputs.operation == 'gemma-extend' || inputs.operation == 'gemma-status') }}
    name: Explicit model operation
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Remove known temporary SSH keys from prior checks
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $tempRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          foreach ($directory in @('pulso-gemma-preflight-42301836044-1', 'pulso-clef-diagnostic-42299085889-1', 'pulso-atom-deploy-42295852056-1')) {
            $legacyDir = Join-Path $env:RUNNER_TEMP $directory
            if (-not ([System.IO.Path]::GetFullPath($legacyDir)).StartsWith($tempRoot, [System.StringComparison]::OrdinalIgnoreCase)) { throw 'Refusing cleanup outside RUNNER_TEMP.' }
            if (Test-Path -LiteralPath $legacyDir) {
              if ((Get-Item -LiteralPath $legacyDir -Force).Attributes -band [System.IO.FileAttributes]::ReparsePoint) { throw 'Refusing cleanup through a directory link.' }
              try {
                foreach ($filename in @('td-apps.pem', 'github-token.txt')) {
                  $legacyKey = Join-Path $legacyDir $filename
                  if (Test-Path -LiteralPath $legacyKey) {
                    if ((Get-Item -LiteralPath $legacyKey -Force).Attributes -band [System.IO.FileAttributes]::ReparsePoint) { throw 'Refusing cleanup through a credential link.' }
                    & icacls $legacyKey '/inheritance:r'
                    if ($LASTEXITCODE -ne 0) { throw 'Could not preserve the private credential ACL.' }
                    & icacls $legacyKey '/grant:r' "${identity}:F"
                    if ($LASTEXITCODE -ne 0) { throw 'Could not authorize credential deletion for the runner identity.' }
                    Remove-Item -LiteralPath $legacyKey -Force
                  }
                }
              }
              finally {
                if (Test-Path -LiteralPath $legacyDir) { Remove-Item -LiteralPath $legacyDir -Recurse -Force }
              }
            }
            if (Test-Path -LiteralPath $legacyDir) { throw 'Known temporary SSH directory remains; cleanup failed.' }
          }
          Write-Output 'Verified removal of the three known temporary credential directories.'
      - uses: actions/checkout@v4
        if: ${{ inputs.operation == 'web-static-install' || inputs.operation == 'tuesday-wednesday-probe' || inputs.operation == 'tuesday-wednesday-inspect' || inputs.operation == 'tuesday-wednesday-status' || inputs.operation == 'thursday-handoff-inspect' || inputs.operation == 'gemma-rejection-inspect' || inputs.operation == 'gemma-format-preflight' || inputs.operation == 'gemma-tuesday-status' || inputs.operation == 'gemma-identity-inspect' || inputs.operation == 'navigation-benchmark' || inputs.operation == 'daily-activity-inspect' || inputs.operation == 'evaluation-batch-inspect' || inputs.operation == 'local-next500-inspect' || inputs.operation == 'local-next500-status' || inputs.operation == 'gemma-preflight' || inputs.operation == 'gemma-inspect' }}
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run the selected model operation
        env:
          TD_APPS_SSH_KEY: ${{ secrets.TD_APPS_SSH_KEY }}
          GEMMA_OPERATION: ${{ inputs.operation }}
          FIRST_RUN_DATE: ${{ inputs.first_run_date }}
          ACTIVITY_DATE: ${{ inputs.activity_date }}
          EXPECTED_SETTINGS_VERSION: ${{ inputs.expected_settings_version }}
          EXPECTED_SCOPE_HASH: ${{ inputs.expected_scope_hash }}
          RESUME_TUESDAY: ${{ inputs.resume_tuesday }}
          HANDOFF_CONCURRENCY: ${{ inputs.handoff_concurrency }}
          EVALUATION_JOB_ID: ${{ inputs.job_id }}
          EXPECTED_POLICY_VERSION: ${{ inputs.expected_policy_version }}
          EXPECTED_EVALUATIONS: ${{ inputs.expected_evaluations }}
          EXPECTED_CONFIGURATION_HASH: ${{ inputs.expected_configuration_hash }}
          EXPECTED_CATALOG_HASH: ${{ inputs.expected_catalog_hash }}
          EXPECTED_PROMPT_HASH: ${{ inputs.expected_prompt_hash }}
          MAINTENANCE_ID: ${{ inputs.maintenance_id }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          CONVERSATION_LIMIT: ${{ inputs.conversation_limit }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GEMMA_OPERATION -cnotin @('web-static-install', 'tuesday-wednesday-probe', 'tuesday-wednesday-inspect', 'tuesday-wednesday-prioritize-thursday', 'tuesday-wednesday-start', 'tuesday-wednesday-start-two', 'thursday-handoff-prepare', 'tuesday-wednesday-stop', 'tuesday-wednesday-status', 'thursday-handoff-inspect', 'gemma-rejection-inspect', 'gemma-format-preflight', 'gemma-tuesday-continue', 'gemma-tuesday-recover', 'gemma-tuesday-status', 'gemma-identity-inspect', 'navigation-benchmark', 'daily-activity-enable', 'daily-activity-run-yesterday', 'daily-activity-inspect', 'evaluation-batch-inspect', 'local-next500-inspect', 'local-next500-start', 'local-next500-status', 'gemma-preflight', 'gemma-inspect', 'gemma-prepare', 'gemma-start', 'gemma-extend', 'gemma-status')) { throw 'Invalid model operation.' }
          $useCheckoutSource = $env:GEMMA_OPERATION -cin @('web-static-install', 'tuesday-wednesday-probe', 'tuesday-wednesday-inspect', 'tuesday-wednesday-status', 'thursday-handoff-inspect', 'gemma-rejection-inspect', 'gemma-format-preflight', 'gemma-tuesday-status', 'gemma-identity-inspect', 'navigation-benchmark', 'daily-activity-inspect', 'evaluation-batch-inspect', 'local-next500-inspect', 'local-next500-status', 'gemma-preflight', 'gemma-inspect')
          if (-not $useCheckoutSource -and $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid expected production revision.' }
          if ($env:GEMMA_OPERATION -ceq 'evaluation-batch-inspect') {
            if ($env:EVALUATION_JOB_ID -cnotmatch '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}(?![\s\S])') { throw 'Evaluation job ID must be a lowercase UUID.' }
          }
          if ($env:GEMMA_OPERATION -cin @('gemma-prepare', 'gemma-start')) {
            if ($env:EXPECTED_POLICY_VERSION -cnotmatch '^[1-9][0-9]{0,15}$' -or [decimal]$env:EXPECTED_POLICY_VERSION -gt 9007199254740991) { throw 'Expected policy version must be a positive safe integer.' }
          }
          if ($env:GEMMA_OPERATION -ceq 'gemma-start') {
            if ($env:EXPECTED_EVALUATIONS -cnotmatch '^(0|[1-9][0-9]{0,15})$' -or [decimal]$env:EXPECTED_EVALUATIONS -gt 9007199254740991) { throw 'Expected evaluation count must be a nonnegative safe integer.' }
            foreach ($hash in @($env:EXPECTED_CONFIGURATION_HASH, $env:EXPECTED_CATALOG_HASH, $env:EXPECTED_PROMPT_HASH)) {
              if ($hash -cnotmatch '^[a-f0-9]{64}$') { throw 'Expected hashes must contain exactly 64 lowercase hexadecimal characters.' }
            }
            if ($env:CONVERSATION_LIMIT -cnotmatch '^([1-9]|[1-9][0-9]|100)$') { throw 'Conversation limit must be an integer between 1 and 100.' }
          }
          if ($env:GEMMA_OPERATION -ceq 'gemma-extend') {
            if ($env:EXPECTED_EVALUATIONS -cnotmatch '^([1-9]|[1-9][0-9]|[1-4][0-9]{2}|500)$') { throw 'Expected maintenance total must be an integer between 1 and 500.' }
            if ($env:CONVERSATION_LIMIT -cnotmatch '^([1-9]|[1-9][0-9]|[1-4][0-9]{2}|500)$') { throw 'Extended conversation limit must be an integer between 1 and 500.' }
          }
          if ($env:GEMMA_OPERATION -cin @('gemma-start', 'gemma-extend')) {
            if ($env:FROM_DATE -cnotmatch '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' -or $env:TO_DATE -cnotmatch '^[0-9]{4}-[0-9]{2}-[0-9]{2}$') { throw 'Selection dates must use YYYY-MM-DD.' }
            $fromDate = [datetime]::MinValue
            $toDate = [datetime]::MinValue
            if (-not [datetime]::TryParseExact($env:FROM_DATE, 'yyyy-MM-dd', [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]::None, [ref]$fromDate) -or -not [datetime]::TryParseExact($env:TO_DATE, 'yyyy-MM-dd', [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]::None, [ref]$toDate) -or $fromDate -gt $toDate) { throw 'Selection dates must be real dates in ascending order.' }
          }
          if ($env:GEMMA_OPERATION -cin @('gemma-status', 'gemma-extend') -and $env:MAINTENANCE_ID -cnotmatch '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$') { throw 'Maintenance ID must be a lowercase UUID.' }
          if ($env:GEMMA_OPERATION -ceq 'daily-activity-enable') {
            if ($env:FIRST_RUN_DATE -cnotmatch '^[0-9]{4}-[0-9]{2}-[0-9]{2}(?![\s\S])' -or $env:EXPECTED_SETTINGS_VERSION -cnotmatch '^[1-9][0-9]{0,14}(?![\s\S])') { throw 'Daily setup requires a date and a positive settings version.' }
          }
          if ($env:GEMMA_OPERATION -ceq 'daily-activity-run-yesterday') {
            if ($env:ACTIVITY_DATE -cnotmatch '^[0-9]{4}-[0-9]{2}-[0-9]{2}(?![\s\S])' -or $env:EXPECTED_SETTINGS_VERSION -cnotmatch '^[1-9][0-9]{0,14}(?![\s\S])') { throw 'Manual daily run requires yesterday and a positive settings version.' }
          }
          if ($env:GEMMA_OPERATION -ceq 'tuesday-wednesday-prioritize-thursday') {
            if ($env:EXPECTED_SETTINGS_VERSION -cnotmatch '^[1-9][0-9]{0,14}(?![\s\S])' -or $env:RESUME_TUESDAY -cnotin @('manual', 'automatic_before_noon')) { throw 'Priority setup requires a settings version and a valid Tuesday resume mode.' }
          }
          if ($env:GEMMA_OPERATION -ceq 'thursday-handoff-prepare') {
            if ($env:EXPECTED_SETTINGS_VERSION -cnotmatch '^[1-9][0-9]{0,14}(?![\s\S])') { throw 'Thursday setup requires a positive settings version.' }
            if ($env:EXPECTED_SCOPE_HASH -cnotmatch '^[a-f0-9]{64}(?![\s\S])') { throw 'Thursday scope hash must contain exactly 64 lowercase hexadecimal characters.' }
            if ($env:HANDOFF_CONCURRENCY -cnotmatch '^[12](?![\s\S])') { throw 'Thursday concurrency must be 1 or 2.' }
          }
          switch -CaseSensitive ($env:GEMMA_OPERATION) {
            'web-static-install' { $entryScript = 'scripts/install-web-static.js'; $scriptArguments = '' }
            'tuesday-wednesday-probe' { $entryScript = 'scripts/inspect-tuesday-wednesday-partials.js'; $scriptArguments = '' }
            'tuesday-wednesday-inspect' { $entryScript = 'scripts/complete-tuesday-wednesday.js'; $scriptArguments = '--inspect' }
            'tuesday-wednesday-prioritize-thursday' { $entryScript = 'scripts/complete-tuesday-wednesday.js'; $scriptArguments = "--prioritize-thursday --expected-version $($env:EXPECTED_SETTINGS_VERSION) --resume-tuesday $($env:RESUME_TUESDAY)" }
            'tuesday-wednesday-start' { $entryScript = 'scripts/complete-tuesday-wednesday.js'; $scriptArguments = '--start' }
            'tuesday-wednesday-start-two' { $entryScript = 'scripts/complete-tuesday-wednesday.js'; $scriptArguments = '--start --concurrency=2' }
            'tuesday-wednesday-stop' { $entryScript = 'scripts/complete-tuesday-wednesday.js'; $scriptArguments = '--stop' }
            'tuesday-wednesday-status' { $entryScript = 'scripts/complete-tuesday-wednesday.js'; $scriptArguments = '--status' }
            'thursday-handoff-inspect' { $entryScript = 'scripts/prepare-thursday-handoff.js'; $scriptArguments = '--inspect' }
            'thursday-handoff-prepare' { $entryScript = 'scripts/prepare-thursday-handoff.js'; $scriptArguments = "--prepare --expected-version $($env:EXPECTED_SETTINGS_VERSION) --expected-scope-hash $($env:EXPECTED_SCOPE_HASH) --concurrency $($env:HANDOFF_CONCURRENCY)" }
            'gemma-rejection-inspect' { $entryScript = 'scripts/inspect-gemma-rejection.js'; $scriptArguments = '' }
            'gemma-format-preflight' { $entryScript = 'scripts/check-gemma-format-repair.js'; $scriptArguments = '' }
            'gemma-tuesday-continue' { $entryScript = 'scripts/recover-tuesday-evaluations.js'; $scriptArguments = '--continue' }
            'gemma-tuesday-recover' { $entryScript = 'scripts/recover-tuesday-evaluations.js'; $scriptArguments = '--start' }
            'gemma-tuesday-status' { $entryScript = 'scripts/recover-tuesday-evaluations.js'; $scriptArguments = '--status' }
            'gemma-identity-inspect' { $entryScript = 'scripts/inspect-gemma-identity.js'; $scriptArguments = '' }
            'navigation-benchmark' { $entryScript = 'scripts/benchmark-navigation.js'; $scriptArguments = '--iterations=21 --trace' }
            'daily-activity-run-yesterday' { $entryScript = 'scripts/configure-daily-activity.js'; $scriptArguments = "--run-yesterday --date $($env:ACTIVITY_DATE) --expected-version $($env:EXPECTED_SETTINGS_VERSION)" }
            'daily-activity-inspect' { $entryScript = 'scripts/configure-daily-activity.js'; $scriptArguments = '--inspect' }
            'daily-activity-enable' { $entryScript = 'scripts/configure-daily-activity.js'; $scriptArguments = "--enable --start-date $($env:FIRST_RUN_DATE) --expected-version $($env:EXPECTED_SETTINGS_VERSION)" }

            'evaluation-batch-inspect' { $entryScript = 'scripts/inspect-evaluation-batch.js'; $scriptArguments = "--job-id $($env:EVALUATION_JOB_ID)" }
            'local-next500-inspect' { $entryScript = 'scripts/start-next-local-batch.js'; $scriptArguments = '--inspect' }
            'local-next500-start' { $entryScript = 'scripts/start-next-local-batch.js'; $scriptArguments = '--start' }
            'local-next500-status' { $entryScript = 'scripts/start-next-local-batch.js'; $scriptArguments = '--status' }
            'gemma-preflight' { $entryScript = 'scripts/check-gemma-contract.js'; $scriptArguments = '' }
            'gemma-inspect' { $entryScript = 'scripts/prepare-gemma-renewal.js'; $scriptArguments = '--inspect' }
            'gemma-prepare' { $entryScript = 'scripts/prepare-gemma-renewal.js'; $scriptArguments = "--prepare --expected-policy-version $($env:EXPECTED_POLICY_VERSION)" }
            'gemma-start' { $entryScript = 'scripts/start-gemma-renewal.js'; $scriptArguments = "--start --expected-evaluations $($env:EXPECTED_EVALUATIONS) --expected-policy-version $($env:EXPECTED_POLICY_VERSION) --expected-configuration-hash $($env:EXPECTED_CONFIGURATION_HASH) --expected-catalog-hash $($env:EXPECTED_CATALOG_HASH) --expected-prompt-hash $($env:EXPECTED_PROMPT_HASH) --from $($env:FROM_DATE) --to $($env:TO_DATE) --limit $($env:CONVERSATION_LIMIT)" }
            'gemma-extend' { $entryScript = 'scripts/extend-gemma-renewal.js'; $scriptArguments = "--extend --maintenance-id $($env:MAINTENANCE_ID) --expected-total $($env:EXPECTED_EVALUATIONS) --from $($env:FROM_DATE) --to $($env:TO_DATE) --limit $($env:CONVERSATION_LIMIT)" }
            'gemma-status' { $entryScript = 'scripts/start-gemma-renewal.js'; $scriptArguments = "--status --maintenance-id $($env:MAINTENANCE_ID)" }
            default { throw 'Unsupported Gemma operation.' }
          }
          if ([string]::IsNullOrWhiteSpace($env:TD_APPS_SSH_KEY)) { throw 'Missing TD_APPS_SSH_KEY.' }
          if ($env:GITHUB_RUN_ID -notmatch '^\d+$' -or $env:GITHUB_RUN_ATTEMPT -notmatch '^\d+$') { throw 'Invalid workflow run identifier.' }
          foreach ($tool in @('ssh', 'scp', 'icacls')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Missing required command: $tool" }
          }
          function Invoke-Checked {
            param([string]$FilePath, [string[]]$Arguments)
            & $FilePath @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$FilePath failed with exit code $LASTEXITCODE" }
          }
          $workDir = Join-Path $env:RUNNER_TEMP "pulso-gemma-check-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          $keyPath = Join-Path $workDir 'td-apps.pem'
          $knownHosts = Join-Path $workDir 'known_hosts'
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'api'
          $remoteRoot = "/tmp/pulso-gemma-check-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $sshTarget = 'ubuntu@10.252.1.214'
          $sshOptions = @()
          $remotePrepared = $false
          $checkExit = 2
          try {
            # checkout also supports REST extraction when Git is unavailable.
            # Copy only this checkout's API after rejecting runtime files/links.
            if ($useCheckoutSource) {
            if (-not (Test-Path -LiteralPath $sourceRoot -PathType Container)) { throw 'API checkout is missing.' }
            $sourceItem = Get-Item -LiteralPath $sourceRoot -Force
            if ($sourceItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) { throw 'Refusing an API checkout link.' }
            $entries = @(Get-ChildItem -LiteralPath $sourceRoot -Force -Recurse)
            if ($entries | Where-Object { $_.Attributes -band [System.IO.FileAttributes]::ReparsePoint }) { throw 'Refusing links in the API checkout.' }
            if ($entries | Where-Object { $_.Name -in @('.data', 'node_modules') -or ($_.Name -match '^\.env(\..*)?$' -and $_.Name -ne '.env.example') }) { throw 'Refusing to copy runtime data or credentials.' }
            if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot $entryScript) -PathType Leaf)) { throw 'Selected Gemma script is missing.' }
            if ($env:GEMMA_OPERATION -ceq 'web-static-install') {
              $staticRoot = Join-Path $env:GITHUB_WORKSPACE 'web/temporary-static'
              if (-not (Test-Path -LiteralPath $staticRoot -PathType Container)) { throw 'Static web artifact is missing.' }
              $staticEntries = @((Get-Item -LiteralPath $staticRoot -Force)) + @(Get-ChildItem -LiteralPath $staticRoot -Force -Recurse)
              if ($staticEntries | Where-Object { $_.Attributes -band [System.IO.FileAttributes]::ReparsePoint }) { throw 'Refusing links in the static web artifact.' }
              foreach ($filename in @('artifact.json', 'index.html')) {
                if (-not (Test-Path -LiteralPath (Join-Path $staticRoot $filename) -PathType Leaf)) { throw 'Incomplete static web artifact.' }
              }
            }
            }

            $key = $env:TD_APPS_SSH_KEY
            if (($key -notmatch "`n") -and ($key -match '\\n')) { $key = $key -replace '\\n', "`n" }
            $key = ($key -replace "`r`n", "`n").TrimEnd() + "`n"
            if ($key -notmatch '-----BEGIN .+ PRIVATE KEY-----' -or $key -notmatch '-----END .+ PRIVATE KEY-----') { throw 'Invalid SSH key format.' }
            [System.IO.File]::WriteAllText($keyPath, $key, [System.Text.Encoding]::ASCII)
            $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            Invoke-Checked -FilePath 'icacls' -Arguments @($keyPath, '/inheritance:r')
            Invoke-Checked -FilePath 'icacls' -Arguments @($keyPath, '/grant:r', "${identity}:R")
            $sshOptions = @('-i', $keyPath, '-p', '22', '-o', 'IdentitiesOnly=yes', '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=15', '-o', 'ServerAliveInterval=15', '-o', 'ServerAliveCountMax=2', '-o', 'StrictHostKeyChecking=accept-new', '-o', "UserKnownHostsFile=$knownHosts")
            $scpOptions = @('-i', $keyPath, '-P', '22', '-o', 'IdentitiesOnly=yes', '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=15', '-o', 'ServerAliveInterval=15', '-o', 'ServerAliveCountMax=2', '-o', 'StrictHostKeyChecking=accept-new', '-o', "UserKnownHostsFile=$knownHosts")
            if ($useCheckoutSource) {
            Invoke-Checked -FilePath 'ssh' -Arguments ($sshOptions + @($sshTarget, "umask 077; mkdir -m 700 -- '$remoteRoot'"))
            $remotePrepared = $true
            Invoke-Checked -FilePath 'scp' -Arguments ($scpOptions + @('-r', $sourceRoot, "${sshTarget}:$remoteRoot/"))
            if ($env:GEMMA_OPERATION -ceq 'web-static-install') {
              Invoke-Checked -FilePath 'scp' -Arguments ($scpOptions + @('-r', $staticRoot, "${sshTarget}:$remoteRoot/static-web"))
            }
            # Isolated source + existing dependencies/env. No pull, npm, PM2,
            # migrations, reset or database writes. Preflight is synthetic only;
            # inspect/status read safe aggregates; the explicit partials probe invokes only authorized missing variables.
            $remoteCommand = @"
          set -Eeuo pipefail
          cleanup_check() { sudo -n rm -rf -- '$remoteRoot' || true; }
          trap cleanup_check EXIT
          trap 'exit 130' HUP INT TERM
          sudo -n chown -R td:td -- '$remoteRoot'
          sudo -n chmod 700 -- '$remoteRoot'
          sudo -n -u td -H test -f '$remoteRoot/api/$entryScript'
          if [ '$env:GEMMA_OPERATION' = 'web-static-install' ]; then
            # Built-ins only: no production environment/dependencies or process changes.
            sudo -n -u td -H bash -c 'cd "`$1" && exec node scripts/install-web-static.js' _ '$remoteRoot/api'
          else
          sudo -n -u td -H test -r /var/www/nodeapps/PulsoAtom/api/.env
          sudo -n -u td -H test -d /var/www/nodeapps/PulsoAtom/api/node_modules
          sudo -n -u td -H ln -s -- /var/www/nodeapps/PulsoAtom/api/node_modules '$remoteRoot/api/node_modules'
          sudo -n -u td -H bash -c 'cd "`$1" && exec node --env-file=/var/www/nodeapps/PulsoAtom/api/.env $entryScript $scriptArguments' _ '$remoteRoot/api'
          fi
          "@
            } else {
              # State-changing commands run only the exact deployed revision.
              # Arguments are restricted to numeric/hex/UUID/validated dates.
              $remoteCommand = @'
          set -Eeuo pipefail
          actual_sha="$(sudo -n -u td -H git -C /var/www/nodeapps/PulsoAtom rev-parse HEAD)"
          [ "$actual_sha" = "__EXPECTED_SHA__" ] || { echo 'Production revision does not match the dispatched commit; no operation started.' >&2; exit 2; }
          sudo -n -u td -H git -C /var/www/nodeapps/PulsoAtom diff --quiet HEAD -- api
          sudo -n -u td -H test -r /var/www/nodeapps/PulsoAtom/api/.env
          sudo -n -u td -H test -f /var/www/nodeapps/PulsoAtom/api/__ENTRY_SCRIPT__
          if [ '__OPERATION__' = 'gemma-tuesday-recover' ]; then
            restart_incident_api() { sudo -n -u td -H env PM2_HOME=/home/td/.pm2 pm2 restart pulso-atom-api >/dev/null; }
            trap restart_incident_api EXIT
            sudo -n -u td -H env PM2_HOME=/home/td/.pm2 pm2 stop pulso-atom-api >/dev/null
          fi
          sudo -n -u td -H bash -c 'cd /var/www/nodeapps/PulsoAtom/api && exec node --env-file=/var/www/nodeapps/PulsoAtom/api/.env __ENTRY_SCRIPT__ __SCRIPT_ARGUMENTS__'
          '@
              $remoteCommand = $remoteCommand.Replace('__EXPECTED_SHA__', $env:GITHUB_SHA).Replace('__ENTRY_SCRIPT__', $entryScript).Replace('__SCRIPT_ARGUMENTS__', $scriptArguments).Replace('__OPERATION__', $env:GEMMA_OPERATION)
            }
            $remoteCommand = $remoteCommand -replace "`r`n", "`n" -replace "`r", "`n"
            & ssh @sshOptions $sshTarget $remoteCommand
            $checkExit = $LASTEXITCODE
          }
          finally {
            try {
              if ($remotePrepared -and $sshOptions.Count -gt 0 -and (Test-Path -LiteralPath $keyPath)) {
                & ssh @sshOptions $sshTarget "sudo -n rm -rf -- '$remoteRoot'"
                if ($LASTEXITCODE -ne 0) { Write-Warning 'Temporary Gemma check source cleanup needs review.' }
              }
            }
            catch { Write-Warning 'Remote Gemma check cleanup could not connect.' }
            finally {
              try {
                if (Test-Path -LiteralPath $keyPath) {
                  $cleanupIdentity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
                  Invoke-Checked -FilePath 'icacls' -Arguments @($keyPath, '/inheritance:r')
                  Invoke-Checked -FilePath 'icacls' -Arguments @($keyPath, '/grant:r', "${cleanupIdentity}:F")
                  Remove-Item -LiteralPath $keyPath -Force
                }
              }
              finally {
                if (Test-Path -LiteralPath $workDir) {
                  $tempRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
                  if (-not ([System.IO.Path]::GetFullPath($workDir)).StartsWith($tempRoot, [System.StringComparison]::OrdinalIgnoreCase)) { throw 'Refusing cleanup outside RUNNER_TEMP.' }
                  Remove-Item -LiteralPath $workDir -Recurse -Force
                }
              }
              if ((Test-Path -LiteralPath $keyPath) -or (Test-Path -LiteralPath $workDir)) { throw 'Current temporary SSH files remain; cleanup failed.' }
              Write-Output 'Verified removal of the current temporary SSH key and directory.'
            }
          }
          if ($checkExit -ne 0) { throw "Model operation failed (exit $checkExit). Review the sanitized result and maintenance status before retrying a state-changing operation." }

  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy') }}
    name: Deploy PulsoAtom to Server 214
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    env:
      DEPLOY_HOST: 10.252.1.214
      DEPLOY_PORT: "22"
      DEPLOY_USER: ubuntu
      REPO: /var/www/nodeapps/PulsoAtom
      API: /var/www/nodeapps/PulsoAtom/api
      WEB: /var/www/nodeapps/PulsoAtom/web
      REPO_URL: https://github.com/Apps-3cGroups/PulsoAtom.git
      PM2_API_APP: pulso-atom-api
      PM2_WEB_APP: pulso-atom-web

    steps:
      - name: Validate required secrets
        env:
          TD_APPS_SSH_KEY: ${{ secrets.TD_APPS_SSH_KEY }}
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TD_APPS_SSH_KEY)) {
            throw 'Missing required secret TD_APPS_SSH_KEY.'
          }

          if ([string]::IsNullOrWhiteSpace($env:GH_DEPLOY_TOKEN)) {
            throw 'Missing required secret GH_DEPLOY_TOKEN.'
          }

      - name: Deploy through SSH
        env:
          TD_APPS_SSH_KEY: ${{ secrets.TD_APPS_SSH_KEY }}
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          foreach ($tool in @('ssh', 'scp', 'icacls')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required command not found on runner: $tool"
            }
          }

          if ([string]::IsNullOrWhiteSpace($env:TD_APPS_SSH_KEY)) {
            throw 'Missing required secret TD_APPS_SSH_KEY.'
          }

          if ([string]::IsNullOrWhiteSpace($env:GH_DEPLOY_TOKEN)) {
            throw 'Missing required secret GH_DEPLOY_TOKEN.'
          }

          function Invoke-Checked {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [Parameter(Mandatory = $true)][string[]]$Arguments
            )

            & $FilePath @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$FilePath failed with exit code $LASTEXITCODE"
            }
          }

          function Protect-PrivateFile {
            param([Parameter(Mandatory = $true)][string]$Path)

            $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            Invoke-Checked -FilePath 'icacls' -Arguments @($Path, '/inheritance:r')
            Invoke-Checked -FilePath 'icacls' -Arguments @($Path, '/grant:r', "${identity}:R")
          }

          $workDir = Join-Path $env:RUNNER_TEMP "pulso-atom-deploy-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null

          $keyPath = Join-Path $workDir 'td-apps.pem'
          $tokenPath = Join-Path $workDir 'github-token.txt'
          $scriptPath = Join-Path $workDir 'deploy-pulso-atom.sh'
          $knownHostsPath = Join-Path $workDir 'known_hosts'
          $remoteToken = $null
          $remoteScriptPath = $null
          $sshTarget = $null
          $sshOptions = @()

          try {
            $key = $env:TD_APPS_SSH_KEY
            if (($key -notmatch "`n") -and ($key -match '\\n')) {
              $key = $key -replace '\\n', "`n"
            }
            $key = ($key -replace "`r`n", "`n").TrimEnd() + "`n"
            if ($key -notmatch '-----BEGIN .+ PRIVATE KEY-----' -or $key -notmatch '-----END .+ PRIVATE KEY-----') {
              throw 'TD_APPS_SSH_KEY does not look like a PEM private key.'
            }

            [System.IO.File]::WriteAllText($keyPath, $key, [System.Text.Encoding]::ASCII)
            Protect-PrivateFile -Path $keyPath

            $token = $env:GH_DEPLOY_TOKEN.Trim()
            [System.IO.File]::WriteAllText($tokenPath, $token, [System.Text.Encoding]::ASCII)
            Protect-PrivateFile -Path $tokenPath

            $remoteScript = @'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          REPO="__REPO__"
          API="__API__"
          WEB="__WEB__"
          REPO_URL="__REPO_URL__"
          API_APP="__PM2_API_APP__"
          WEB_APP="__PM2_WEB_APP__"
          TOKEN_FILE="${1:-}"
          ASKPASS=""
          MONITOR_BACKUP=""

          cleanup() {
            if [ -n "${MONITOR_BACKUP:-}" ] && [ -d "$MONITOR_BACKUP/monitor-evaluaciones" ]; then
              mkdir -p "$WEB/dist"
              cp -a "$MONITOR_BACKUP/monitor-evaluaciones" "$WEB/dist/"
              rm -rf "$MONITOR_BACKUP"
            fi
            if [ -n "${ASKPASS:-}" ] && [ -f "$ASKPASS" ]; then
              rm -f "$ASKPASS"
            fi

            if [ -n "${TOKEN_FILE:-}" ] && [ -f "$TOKEN_FILE" ]; then
              shred -u "$TOKEN_FILE" 2>/dev/null || rm -f "$TOKEN_FILE"
            fi
          }
          trap cleanup EXIT

          fail() {
            echo "ERROR: $*" >&2
            exit 1
          }

          echo "Deploy target: $(hostname)"
          echo "Deploy user: $(id -un)"
          echo "Repository: $REPO"
          echo "Database scripts: versioned additive migrations."

          [ "$(id -un)" = "td" ] || fail "Remote deploy must run as td."
          [ -n "$TOKEN_FILE" ] || fail "Token file argument is required."
          [ -f "$TOKEN_FILE" ] || fail "Token file does not exist: $TOKEN_FILE"

          for required_path in "$REPO/.git" "$API/package.json" "$WEB/package.json" "$API/.env" "$WEB/.env" "$REPO/ecosystem.config.js"; do
            [ -e "$required_path" ] || fail "Preflight missing required path: $required_path"
          done

          cd "$REPO"

          [ "$(git symbolic-ref --short HEAD)" = main ] || fail "Deploy checkout must be on main."
          [ "$(git remote get-url origin)" = "$REPO_URL" ] || fail "Unexpected origin URL; no changes made."


          echo "Checking working tree before pull"
          git status --short
          status_output="$(git status --porcelain)"
          if [ -n "$status_output" ]; then
            fail "Unexpected working tree changes; inspect them before deploying."
          fi

          ASKPASS="$(mktemp /tmp/pulso-atom-askpass.XXXXXX)"
          cat > "$ASKPASS" <<'ASKPASS_SCRIPT'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'jjosegarcia' ;;
            *Password*) cat "$GH_TOKEN_FILE" ;;
            *) printf '\n' ;;
          esac
          ASKPASS_SCRIPT
          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GH_TOKEN_FILE="$TOKEN_FILE"
          export GIT_TERMINAL_PROMPT=0

          echo "Pulling main with ff-only"
          PREVIOUS_HEAD="$(git rev-parse HEAD)"
          git pull --ff-only origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || fail "Local commits differ from remote main; deployment stopped."

          API_DEPLOY_REQUIRED=true
          if [ "$PREVIOUS_HEAD" != "$(git rev-parse HEAD)" ] && git diff --quiet "$PREVIOUS_HEAD" HEAD -- api/ ecosystem.config.js web/server.js web/package.json web/package-lock.json package.json package-lock.json; then
            API_DEPLOY_REQUIRED=false
          fi

          unset GIT_ASKPASS GH_TOKEN_FILE GIT_TERMINAL_PROMPT

          if [ "$API_DEPLOY_REQUIRED" = true ]; then
            if [ "$PREVIOUS_HEAD" != "$(git rev-parse HEAD)" ] && [ -d "$API/node_modules" ] && git diff --quiet "$PREVIOUS_HEAD" HEAD -- api/package.json api/package-lock.json; then
              echo "API dependencies unchanged: preserving the directory used by detached evaluation workers."
            else
              echo "Installing API dependencies"
              npm ci --prefix "$API" --omit=dev --ignore-scripts --no-audit --no-fund
            fi

            echo "Applying additive API migrations"
            npm run db:migrate --prefix "$API" -- --defer-online-indexes
          fi

          echo "Installing web dependencies"
          npm ci --prefix "$WEB" --ignore-scripts --no-audit --no-fund

          echo "Checking summary filter overlays before replacing web assets"
          (cd "$WEB" && node --test test/summary-overlays.test.js)

          echo "Building web"
          if [ -d "$WEB/dist/monitor-evaluaciones" ]; then
            MONITOR_BACKUP="$(mktemp -d /tmp/pulso-monitor-backup.XXXXXX)"
            cp -a "$WEB/dist/monitor-evaluaciones" "$MONITOR_BACKUP/"
          fi
          npm run build --prefix "$WEB"
          if [ -n "$MONITOR_BACKUP" ]; then
            cp -a "$MONITOR_BACKUP/monitor-evaluaciones" "$WEB/dist/"
          fi

          export PM2_HOME=/home/td/.pm2
          if [ "$API_DEPLOY_REQUIRED" = true ]; then
            echo "Restarting PM2 targets"
            pm2 startOrReload "$REPO/ecosystem.config.js" --update-env >/dev/null
            pm2 save >/dev/null

            echo "Waiting for API startup and its initialization transaction"
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-max-time 90 --retry-connrefused --max-time 15 http://127.0.0.1:4001/pulsoAtom/api/health
            printf '\n'

            echo "Applying online navigation indexes after API startup"
            npm run db:migrate --prefix "$API"
          else
            echo "Frontend-only release: API, workers and PM2 processes were not restarted."
          fi

          echo "Checking PulsoAtom health and web"
          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-connrefused --max-time 15 http://127.0.0.1:4001/pulsoAtom/api/health
          printf '\n'
          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-connrefused --max-time 15 -o /dev/null -w 'WEB HTTP %{http_code}\n' http://127.0.0.1:3000/pulsoAtom/

          echo "Final git status"
          git status --short --branch

          echo "PM2 target status"
          pm2 status "$API_APP"
          pm2 status "$WEB_APP"
          '@

            $remoteScript = ($remoteScript -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
            $remoteScript = $remoteScript.
              Replace('__REPO__', $env:REPO).
              Replace('__API__', $env:API).
              Replace('__WEB__', $env:WEB).
              Replace('__REPO_URL__', $env:REPO_URL).
              Replace('__PM2_API_APP__', $env:PM2_API_APP).
              Replace('__PM2_WEB_APP__', $env:PM2_WEB_APP)
            $remoteScript = $remoteScript -replace "`r`n", "`n" -replace "`r", "`n"
            [System.IO.File]::WriteAllText($scriptPath, $remoteScript, [System.Text.UTF8Encoding]::new($false))

            $remoteToken = "/tmp/pulso-atom-gh-token-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
            $remoteScriptPath = "/tmp/deploy-pulso-atom-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).sh"
            $sshTarget = "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST)"
            $sshOptions = @(
              '-i', $keyPath,
              '-p', $env:DEPLOY_PORT,
              '-o', 'IdentitiesOnly=yes',
              '-o', 'BatchMode=yes',
              '-o', 'ConnectTimeout=15',
              '-o', 'StrictHostKeyChecking=accept-new',
              '-o', "UserKnownHostsFile=$knownHostsPath"
            )
            $scpOptions = @(
              '-i', $keyPath,
              '-P', $env:DEPLOY_PORT,
              '-o', 'IdentitiesOnly=yes',
              '-o', 'BatchMode=yes',
              '-o', 'ConnectTimeout=15',
              '-o', 'StrictHostKeyChecking=accept-new',
              '-o', "UserKnownHostsFile=$knownHostsPath"
            )

            Invoke-Checked -FilePath 'scp' -Arguments ($scpOptions + @($tokenPath, "${sshTarget}:$remoteToken"))
            Invoke-Checked -FilePath 'scp' -Arguments ($scpOptions + @($scriptPath, "${sshTarget}:$remoteScriptPath"))

            $remoteCommand = @"
          set -u
          cleanup_remote() {
            sudo -n rm -f -- '$remoteToken' '$remoteScriptPath' || true
          }
          trap cleanup_remote EXIT
          sudo -n chown td:td '$remoteToken' '$remoteScriptPath' || exit 1
          sudo -n chmod 600 '$remoteToken' || exit 1
          sudo -n chmod 700 '$remoteScriptPath' || exit 1
          sudo -n -u td -H bash '$remoteScriptPath' '$remoteToken'
          status=`$?
          exit `$status
          "@
            $remoteCommand = $remoteCommand -replace "`r`n", "`n" -replace "`r", "`n"

            Invoke-Checked -FilePath 'ssh' -Arguments ($sshOptions + @($sshTarget, $remoteCommand))
          }
          finally {
            try {
              if ($sshTarget -and $remoteToken -and $remoteScriptPath -and $sshOptions.Count -gt 0 -and (Test-Path -LiteralPath $keyPath)) {
                try {
                  & ssh @sshOptions $sshTarget "sudo -n rm -f -- '$remoteToken' '$remoteScriptPath'"
                  if ($LASTEXITCODE -ne 0) {
                    Write-Warning "Remote temporary credential cleanup is pending on $sshTarget."
                  }
                }
                catch {
                  Write-Warning "Remote temporary credential cleanup could not connect to $sshTarget."
                }
                $global:LASTEXITCODE = 0
              }
            }
            finally {
              try {
                $cleanupIdentity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
                foreach ($credentialPath in @($tokenPath, $keyPath)) {
                  if (Test-Path -LiteralPath $credentialPath) {
                    Invoke-Checked -FilePath 'icacls' -Arguments @($credentialPath, '/inheritance:r')
                    Invoke-Checked -FilePath 'icacls' -Arguments @($credentialPath, '/grant:r', "${cleanupIdentity}:F")
                    Remove-Item -LiteralPath $credentialPath -Force
                  }
                }
              }
              finally {
                if (Test-Path -LiteralPath $workDir) {
                  $cleanupRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
                  $cleanupTarget = [System.IO.Path]::GetFullPath($workDir)
                  if (-not $cleanupTarget.StartsWith($cleanupRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
                    throw 'Refusing to remove a directory outside RUNNER_TEMP.'
                  }
                  Remove-Item -LiteralPath $workDir -Recurse -Force
                }
              }
              if ((Test-Path -LiteralPath $keyPath) -or (Test-Path -LiteralPath $tokenPath) -or (Test-Path -LiteralPath $workDir)) { throw 'Deployment credentials remain; cleanup failed.' }
              Write-Output 'Verified removal of deployment credentials and temporary directory.'
            }
          }
